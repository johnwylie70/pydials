[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydials"
version = "0.0.0"
description = "Dials, sliders, buttons, a piano keyboard, a scope and meters to put on a Pyctures scene. They lay themselves out, work by touch, mouse and keyboard, and can be tied to a synth's settings."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Wylie" }]
keywords = ["dials", "controls", "dial", "knob", "slider", "piano", "keyboard", "oscilloscope", "meter", "synth", "games", "education", "pyodide"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Education",
]
dependencies = ["pyctures>=0.2.0"]

[project.optional-dependencies]
test = ["pytest>=7", "playwright>=1.40"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pydials = ["web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
